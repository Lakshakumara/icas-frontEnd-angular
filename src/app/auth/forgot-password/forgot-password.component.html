<div class="forgot-password-wrapper" fxLayoutAlign="center center" fxFlexFill>
  <mat-card>
    <mat-card-header>
      <mat-card-title>Password Reset</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form
        [formGroup]="forgotForm"
        (ngSubmit)="onSubmit()"
        fxLayout="column"
        fxLayoutGap="16px"
      >
        <mat-form-field appearance="outline">
          <mat-label>Email Address</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error *ngIf="f['email'].hasError('required')">
            Email is required
          </mat-error>
          <mat-error
            *ngIf="
              f['email'].hasError('email') && !f['email'].hasError('required')
            "
          >
            Invalid email address
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="forgotForm.invalid"
        >
          Send Reset Link
        </button>
      </form>

      <div fxLayoutAlign="center" style="margin-top: 16px">
        <a routerLink="/signin">Back to Sign In</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
