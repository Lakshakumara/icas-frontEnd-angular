<div class="login-container" fxLayoutAlign="center center" fxFlexFill>
  <mat-card class="login-card mat-elevation-z6">
    <div class="login-header">
      <img src="assets/images/ousl-logo-2.png" alt="OUSL Logo" class="login-logo" />
      <h2 class="login-title">OUSL Insurance Claim Automation System</h2>
    </div>

    <mat-card-content>
      <form class="login-form" [formGroup]="empNoForm" (ngSubmit)="isMemberNew()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Employee Number</mat-label>
          <input matInput placeholder="Enter your employee number" formControlName="empNo" />
        </mat-form-field>

        <button mat-raised-button color="primary" [disabled]="!empNoForm.valid" type="submit">
          Search
        </button>

        <div class="forgot-password">
          <a routerLink="/forgot-password">Forgot Password?</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
